<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" fill="none" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Hannah the Editor</title>
  <!-- Fine editorial masthead rules in Neutral Brown -->
  <line x1="24" y1="12" x2="376" y2="12" stroke="#4A3B32" stroke-opacity="0.28" stroke-width="1" />

  <!-- Editorial Masthead Wordmark -->
  <text
    x="200"
    y="56"
    text-anchor="middle"
    fill="#4A3B32"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="500"
    letter-spacing="3.5"
  >HANNAH</text>

  <!-- Subtitle & Hairlines -->
  <line x1="56" y1="78" x2="128" y2="78" stroke="#4A3B32" stroke-opacity="0.35" stroke-width="1" />
  <text
    x="200"
    y="82"
    text-anchor="middle"
    fill="#4A3B32"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="10.5"
    font-weight="600"
    letter-spacing="4.2"
  >THE EDITOR</text>
  <line x1="272" y1="78" x2="344" y2="78" stroke="#4A3B32" stroke-opacity="0.35" stroke-width="1" />
</svg>
