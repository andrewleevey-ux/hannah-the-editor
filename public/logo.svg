<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 8 352 80" fill="none" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Hannah The Editor</title>
  <!-- Fine editorial masthead top rule -->
  <line x1="24" y1="12" x2="376" y2="12" stroke="#4A3B32" stroke-opacity="0.4" stroke-width="1.35" />

  <!-- Editorial Masthead Wordmark -->
  <text
    x="200"
    y="56"
    text-anchor="middle"
    fill="#4A3B32"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="500"
    letter-spacing="3.5"
  >HANNAH</text>

  <!-- Subtitle & Flanking Hairlines -->
  <line x1="52" y1="79" x2="120" y2="79" stroke="#4A3B32" stroke-opacity="0.45" stroke-width="1.35" />
  <text
    x="200"
    y="83"
    text-anchor="middle"
    fill="#4A3B32"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="12"
    font-weight="600"
    letter-spacing="4.2"
  >THE EDITOR</text>
  <line x1="280" y1="79" x2="348" y2="79" stroke="#4A3B32" stroke-opacity="0.45" stroke-width="1.35" />
</svg>
